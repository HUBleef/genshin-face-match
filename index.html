<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원신 캐릭터 매칭</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 30px rgba(59, 130, 246, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <header class="w-full max-w-2xl text-center my-6">
        <h1 class="text-3xl md:text-5xl font-extrabold bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">
            ✨ 원신 캐릭터 매칭
        </h1>
        <p class="text-gray-400 text-sm md:text-base mt-2">AI가 얼굴 사진과 분위기를 분석해 가장 닮은 원신 인물을 찾아드립니다!</p>
    </header>

    <main class="w-full max-w-2xl glass rounded-3xl p-6 md:p-8 shadow-2xl glow mb-8">
        <div class="space-y-6">
            <div id="dropZone" class="border-2 border-dashed border-gray-700 hover:border-blue-500 rounded-2xl p-6 text-center cursor-pointer transition bg-gray-950/40 relative overflow-hidden group">
                <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                <div id="uploadPrompt" class="flex flex-col items-center space-y-3">
                    <div class="w-14 h-14 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400 text-xl group-hover:scale-110 transition">📷</div>
                    <div>
                        <p class="text-sm font-medium text-gray-300">내 얼굴 사진을 업로드하거나 여기로 드래그하세요</p>
                        <p class="text-xs text-gray-500 mt-0.5">지원 형식: PNG, JPG, WEBP</p>
                    </div>
                </div>
                <div id="previewContainer" class="hidden relative z-20 flex flex-col items-center">
                    <img id="previewImg" src="" alt="업로드된 사진" class="max-h-48 rounded-xl object-contain shadow-md mb-2">
                    <span class="text-xs text-blue-400 font-medium">클릭하거나 다른 사진을 드랍하여 교체</span>
                </div>
            </div>

            <div>
                <p class="text-xs font-semibold text-gray-400 mb-2">✨ 원신 캐릭터 샘플로 바로 테스트해보기</p>
                <div class="grid grid-cols-6 gap-2">
                    <button onclick="selectSample('https://enka.network/ui/UI_AvatarIcon_Zhongli.png')" class="rounded-xl overflow-hidden border border-gray-700 hover:border-blue-500 transition bg-gray-900 aspect-square">
                        <img src="https://enka.network/ui/UI_AvatarIcon_Zhongli.png" class="w-full h-full object-cover">
                    </button>
                    <button onclick="selectSample('https://enka.network/ui/UI_AvatarIcon_ShoukiNoKami.png')" class="rounded-xl overflow-hidden border border-gray-700 hover:border-blue-500 transition bg-gray-900 aspect-square">
                        <img src="https://enka.network/ui/UI_AvatarIcon_ShoukiNoKami.png" class="w-full h-full object-cover">
                    </button>
                    <button onclick="selectSample('https://enka.network/ui/UI_AvatarIcon_Furina.png')" class="rounded-xl overflow-hidden border border-gray-700 hover:border-blue-500 transition bg-gray-900 aspect-square">
                        <img src="https://enka.network/ui/UI_AvatarIcon_Furina.png" class="w-full h-full object-cover">
                    </button>
                    <button onclick="selectSample('https://enka.network/ui/UI_AvatarIcon_Nahida.png')" class="rounded-xl overflow-hidden border border-gray-700 hover:border-blue-500 transition bg-gray-900 aspect-square">
                        <img src="https://enka.network/ui/UI_AvatarIcon_Nahida.png" class="w-full h-full object-cover">
                    </button>
                    <button onclick="selectSample('https://enka.network/ui/UI_AvatarIcon_Alhaitham.png')" class="rounded-xl overflow-hidden border border-gray-700 hover:border-blue-500 transition bg-gray-900 aspect-square">
                        <img src="https://enka.network/ui/UI_AvatarIcon_Alhaitham.png" class="w-full h-full object-cover">
                    </button>
                    <button onclick="selectSample('https://enka.network/ui/UI_AvatarIcon_Paimon.png')" class="rounded-xl overflow-hidden border border-gray-700 hover:border-blue-500 transition bg-gray-900 aspect-square">
                        <img src="https://enka.network/ui/UI_AvatarIcon_Paimon.png" class="w-full h-full object-cover">
                    </button>
                </div>
            </div>

            <button onclick="analyzeFace()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg transition transform active:scale-[0.98]">
                🔍 내 얼굴과 닮은 원신 캐릭터 찾기!
            </button>
        </div>

        <div id="loading" class="hidden mt-8 text-center space-y-3">
            <div class="inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm text-blue-400 font-medium">백엔드 AI 서버가 얼굴을 분석하고 있습니다...</p>
        </div>

        <div id="resultContainer" class="hidden mt-8 pt-6 border-t border-gray-800 space-y-6">
            <div class="flex flex-col md:flex-row items-center bg-gray-950/60 p-6 rounded-2xl border border-gray-800 gap-6">
                <div class="w-32 h-32 md:w-40 md:h-40 rounded-2xl overflow-hidden bg-gray-900 border border-gray-700 flex-shrink-0 shadow-lg">
                    <img id="resultCharImg" src="" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 text-center md:text-left space-y-2">
                    <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20" id="resultMatchRate">싱크로율 98%</div>
                    <h2 class="text-2xl font-bold text-white" id="resultCharName">캐릭터 이름</h2>
                    <p class="text-sm text-gray-300 leading-relaxed" id="resultReason">분석 이유 설명...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-gray-600">&copy; Genshin Character Face Matcher</footer>

    <script>
        let currentBase64Image = null;

        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const previewImg = document.getElementById('previewImg');

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentBase64Image = event.target.result;
                    previewImg.src = currentBase64Image;
                    uploadPrompt.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        function selectSample(url) {
            fetch(url)
                .then(res => res.blob())
                .then(blob => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        currentBase64Image = e.target.result;
                        previewImg.src = currentBase64Image;
                        uploadPrompt.classList.add('hidden');
                        previewContainer.classList.remove('hidden');
                    };
                    reader.readAsDataURL(blob);
                });
        }

        async function analyzeFace() {
            if (!currentBase64Image) {
                alert('사진을 업로드하거나 샘플을 선택해주세요!');
                return;
            }

            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            const base64Data = currentBase64Image.split(',')[1];
            const mimeType = currentBase64Image.match(/data:(.*?);base64/)[1];

            try {
                // 내 백엔드 API 서버로 요청
                const response = await fetch('/api/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64: base64Data, mimeType: mimeType })
                });

                const result = await response.json();
                if (result.error) throw new Error(result.error);

                document.getElementById('resultCharName').innerText = result.name;
                document.getElementById('resultMatchRate').innerText = `싱크로율 ${result.matchRate}`;
                document.getElementById('resultReason').innerText = result.reason;

                const charMap = {
                    '종려': 'Zhongli', '라이덴 쇼군': 'ShoukiNoKami', '푸리나': 'Furina', '나히다': 'Nahida', 
                    '알하이탐': 'Alhaitham', '페이몬': 'Paimon', '다인슬레이프': 'Dainsleif', '시뇨라': 'Signora',
                    '도토레': 'Dottore', '콜롬비나': 'Columbina', '피에로': 'Pierro', '스커크': 'Skirk',
                    '아를레킨노': 'Arlecchino', '카피타노': 'Capitano', '룩카데바타': 'Rukkhadevata'
                };
                
                let iconKey = charMap[result.name] || result.iconKey || 'Zhongli';
                document.getElementById('resultCharImg').src = `https://enka.network/ui/UI_AvatarIcon_${iconKey}.png`;

                loading.classList.add('hidden');
                resultContainer.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                alert('분석 중 오류가 발생했습니다: ' + error.message);
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
