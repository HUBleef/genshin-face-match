<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원신 캐릭터 매칭</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 35px rgba(99, 102, 241, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- 헤더 -->
    <header class="w-full max-w-2xl text-center my-6">
        <h1 class="text-3xl md:text-5xl font-extrabold bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">
            ✨ 원신 캐릭터 매칭
        </h1>
        <p class="text-gray-400 text-sm md:text-base mt-2">Gemini AI가 사진을 분석해 나와 가장 닮은 원신 캐릭터를 찾아드립니다!</p>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="w-full max-w-2xl glass rounded-3xl p-6 md:p-8 shadow-2xl glow mb-8">
        <div class="space-y-6">
            <!-- 드래그 앤 드롭 업로드 박스 -->
            <div id="dropZone" class="border-2 border-dashed border-gray-700 hover:border-indigo-500 rounded-2xl p-6 text-center cursor-pointer transition bg-gray-950/40 relative overflow-hidden group">
                <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                <div id="uploadPrompt" class="flex flex-col items-center space-y-3">
                    <div class="w-14 h-14 rounded-full bg-indigo-500/10 flex items-center justify-center text-indigo-400 text-2xl group-hover:scale-110 transition">
                        📸
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-300">얼굴 사진을 업로드하거나 여기로 드래그하세요</p>
                        <p class="text-xs text-gray-500 mt-0.5">PNG, JPG, WEBP 이미지 지원</p>
                    </div>
                </div>
                <!-- 미리보기 이미지 -->
                <div id="previewContainer" class="hidden relative z-20 flex flex-col items-center">
                    <img id="previewImg" src="" alt="업로드 사진" class="max-h-48 rounded-xl object-contain shadow-md mb-2">
                    <span class="text-xs text-indigo-400 font-medium">다른 사진으로 변경하려면 클릭하세요</span>
                </div>
            </div>

            <!-- 분석 시작 버튼 -->
            <button onclick="analyzeFace()" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg transition transform active:scale-[0.98]">
                🔍 내 얼굴과 닮은 원신 캐릭터 찾기!
            </button>
        </div>

        <!-- 로딩 상태 -->
        <div id="loading" class="hidden mt-8 text-center space-y-3">
            <div class="inline-block w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm text-indigo-400 font-medium">AI가 얼굴의 특징과 분위기를 정밀 분석하고 있습니다...</p>
        </div>

        <!-- 결과 출력 영역 -->
        <div id="resultContainer" class="hidden mt-8 pt-6 border-t border-gray-800 space-y-6">
            <div class="bg-gray-950/70 p-6 rounded-2xl border border-gray-800 text-center md:text-left space-y-3">
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-2">
                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20" id="resultMatchRate">싱크로율 98%</span>
                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-purple-500/10 text-purple-400 border border-purple-500/20" id="resultElement">원소: 바위</span>
                </div>
                <h2 class="text-3xl font-extrabold text-white" id="resultCharName">캐릭터 이름</h2>
                <p class="text-sm text-gray-300 leading-relaxed pt-2 border-t border-gray-800/80" id="resultReason">분석 이유 설명...</p>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-gray-600">&copy; Genshin Character Face Matcher</footer>

    <script>
        let currentBase64Image = null;

        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const previewImg = document.getElementById('previewImg');

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentBase64Image = event.target.result;
                    previewImg.src = currentBase64Image;
                    uploadPrompt.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        async function analyzeFace() {
            if (!currentBase64Image) {
                alert('분석할 사진을 업로드해주세요!');
                return;
            }

            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            const base64Data = currentBase64Image.split(',')[1];
            const mimeType = currentBase64Image.match(/data:(.*?);base64/)[1];

            try {
                const response = await fetch('/api/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64: base64Data, mimeType: mimeType })
                });

                // 텍스트로 먼저 응답을 받아옴 (Unexpected token 에러 방지)
                const responseText = await response.text();
                
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (e) {
                    // 서버가 JSON이 아니라 텍스트나 HTML 에러를 보낸 경우
                    throw new Error(`서버 응답 오류: ${responseText.substring(0, 100)}`);
                }

                if (!response.ok || result.error) {
                    throw new Error(result.error || `서버 에러 발생 (코드: ${response.status})`);
                }

                document.getElementById('resultCharName').innerText = result.name;
                document.getElementById('resultMatchRate').innerText = `싱크로율 ${result.matchRate}`;
                document.getElementById('resultElement').innerText = `원소/상징: ${result.element || '알 수 없음'}`;
                document.getElementById('resultReason').innerText = result.reason;

                loading.classList.add('hidden');
                resultContainer.classList.add('hidden'); // 또는 remove로 결과 표시

            } catch (error) {
                console.error(error);
                alert('분석 중 오류가 발생했습니다: ' + error.message);
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
